<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ heading }}</title>
  </head>
  <body style="margin:0;background:#f3f5fb;color:#172033;font-family:Arial,Helvetica,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f5fb;padding:32px 12px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 12px 36px rgba(31,42,86,.10);">
          <tr><td style="padding:28px 36px;background:linear-gradient(135deg,#1626d8,#5363ff);color:#fff;">
            <div style="font-size:25px;font-weight:800;letter-spacing:-.7px;">TickFirst</div>
            <div style="margin-top:5px;font-size:12px;opacity:.82;letter-spacing:.08em;text-transform:uppercase;">Events made effortless</div>
          </td></tr>
          <tr><td style="padding:38px 36px 20px;">
            <h1 style="margin:0 0 18px;font-size:27px;line-height:1.25;color:#10162f;">{{ heading }}</h1>
            <div style="font-size:16px;line-height:1.75;color:#505a70;white-space:pre-line;">{{ body }}</div>
            {% if action_url and action_label %}
              <div style="padding:28px 0 8px;">
                <a href="{{ action_url }}" style="display:inline-block;padding:14px 24px;border-radius:10px;background:#2638ef;color:#fff;text-decoration:none;font-size:15px;font-weight:700;">{{ action_label }}</a>
              </div>
            {% endif %}
          </td></tr>
          <tr><td style="padding:22px 36px 30px;border-top:1px solid #edf0f7;color:#7b8498;font-size:12px;line-height:1.6;">
            This email was sent by TickFirst. Please do not share verification codes or ticket QR codes with anyone.<br>
            <a href="{{ frontend_url }}" style="color:#2638ef;text-decoration:none;">Visit TickFirst</a>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
