{% extends "emails/base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block preheader %}{{ preheader }}{% endblock %}
{% block content %}
  <div style="margin:0 0 20px;">{{ body|linebreaksbr }}</div>
  {% if action_url and action_label %}
    <table role="presentation" cellspacing="0" cellpadding="0" border="0"><tr><td bgcolor="#292722" style="border-radius:6px;text-align:center;">
      <a href="{{ action_url }}" style="display:inline-block;border:14px solid #292722;border-left-width:22px;border-right-width:22px;border-radius:6px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:bold;">{{ action_label }}</a>
    </td></tr></table>
  {% endif %}
{% endblock %}
