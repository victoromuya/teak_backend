name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tickfirst_test
          POSTGRES_USER: tickfirst
          POSTGRES_PASSWORD: tickfirst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickfirst -d tickfirst_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: tick_backend.test_settings
      TEST_DATABASE_URL: postgresql://tickfirst:tickfirst@127.0.0.1:5432/tickfirst_test
      SECRET_KEY: ci-only-secret-key
      PAYSTACK_SECRET_KEY: sk_test_ci
      FRONTEND_URL: http://localhost:5173
      EMAIL_HOST_PASSWORD: ci-only-password
      CLOUDSTORE_API_KEY: ci-only-key
      CLOUDSTORE_API_SECRET: ci-only-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test
